<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;width:1920px;height:810px;background:#F3EEE4;overflow:hidden}svg{display:block}</style>
<svg id="s" width="1920" height="810" viewBox="0 0 1920 810">
  <line x1="160" y1="600" x2="1760" y2="600" stroke="#2B2B2B" stroke-width="4"/>
  <rect id="bar" x="160" y="420" height="180" fill="#B5462B"/>
  <circle id="dot" cy="380" r="22" fill="#2B2B2B"/></svg>
<script>
  window.SECONDS = 3;
  const ease = (u) => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));
  window.frame = (t) => { const u = ease(t / 2.5), w = 1600 * u;      // a bar grows, a marker rides its edge
    bar.setAttribute("width", w); dot.setAttribute("cx", 160 + w); };
</script>
